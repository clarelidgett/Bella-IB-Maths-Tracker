<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI HL Exam Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1a2e;--bg2:#10243d;--card:#142c4a;--line:#1f3d61;--teal:#2dd4bf;--text:#e6edf5;--muted:#9fb3c8;--amber:#fbbf24;--red:#f87171;--green:#4ade80;--mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.45;font-size:14px}
header{background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:16px;margin:0;font-weight:600}h1 span{color:var(--teal);font-family:var(--mono);font-size:12px;margin-left:8px}
nav{display:flex;flex-wrap:wrap;gap:6px}nav button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:13px}
nav button.on{background:var(--teal);color:#06202a;border-color:var(--teal);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:12px 0 6px;color:var(--teal)}
.muted{color:var(--muted);font-size:12.5px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.ahl{border-color:#b45309;color:var(--amber)}.tag.sl{border-color:var(--teal);color:var(--teal)}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--teal)}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle;font-size:13px}th{color:var(--muted);font-weight:500;font-size:12px}
td.c,th.c{text-align:center;width:72px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal);cursor:pointer}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:7px;font-family:var(--sans);font-size:13px}
textarea{width:100%;min-height:60px}
button.btn{background:var(--teal);color:#06202a;border:0;padding:7px 12px;border-radius:8px;font-weight:600;cursor:pointer;font-family:var(--sans);font-size:13px;margin:3px 3px 3px 0}
button.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}button.ghost2{background:transparent;color:var(--muted);border:1px solid var(--line)}button.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.box{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:10px}.m{background:#0f3d2e;color:var(--green)}.d{background:#3d2f0f;color:var(--amber)}.n{background:var(--bg);color:var(--muted)}
.ph{display:flex;gap:6px;flex-wrap:wrap}.ph div{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg2)}.ph div.cur{border-color:var(--teal)}.ph b{display:block;font-size:12px;color:var(--teal)}
details summary{cursor:pointer;color:var(--teal)}
@media(max-width:640px){td.c,th.c{width:44px}th.lbl{display:none}td{font-size:12px}}
</style></head><body>
<header><h1>AI HL Exam Tracker <span>May 2027</span></h1><nav id="nav"></nav></header><main id="main"></main>
<script>
const SK=[{"id": "T1.1-SL", "topic": "T1", "name": "Standard form", "level": "SL"}, {"id": "T1.2-SL", "topic": "T1", "name": "Arithmetic sequences and series", "level": "SL"}, {"id": "T1.3-SL", "topic": "T1", "name": "Geometric sequences and series", "level": "SL"}, {"id": "T1.4-SL", "topic": "T1", "name": "Financial applications: compound interest, depreciation", "level": "SL"}, {"id": "T1.5-SL", "topic": "T1", "name": "Exponents and logarithms (introduction)", "level": "SL"}, {"id": "T1.6-SL", "topic": "T1", "name": "Approximation, bounds, percentage error", "level": "SL"}, {"id": "T1.7-SL", "topic": "T1", "name": "Amortisation and annuities", "level": "SL"}, {"id": "T1.8-SL", "topic": "T1", "name": "Systems of linear equations and polynomial equations with technology", "level": "SL"}, {"id": "T1.9-AHL", "topic": "T1", "name": "Laws of logarithms", "level": "AHL"}, {"id": "T1.10-AHL", "topic": "T1", "name": "Rational exponents", "level": "AHL"}, {"id": "T1.11-AHL", "topic": "T1", "name": "Sum of infinite geometric sequences", "level": "AHL"}, {"id": "T1.12-AHL", "topic": "T1", "name": "Complex numbers: Cartesian form", "level": "AHL"}, {"id": "T1.13-AHL", "topic": "T1", "name": "Complex numbers: polar and exponential form", "level": "AHL"}, {"id": "T1.14-AHL", "topic": "T1", "name": "Matrices: operations, determinant, inverse, solving systems", "level": "AHL"}, {"id": "T1.15-AHL", "topic": "T1", "name": "Eigenvalues, eigenvectors, diagonalisation", "level": "AHL"}, {"id": "T2.1-SL", "topic": "T2", "name": "Straight lines", "level": "SL"}, {"id": "T2.2-SL", "topic": "T2", "name": "Functions, domain, range, inverse", "level": "SL"}, {"id": "T2.3-SL", "topic": "T2", "name": "Graphs of functions", "level": "SL"}, {"id": "T2.4-SL", "topic": "T2", "name": "Key features of graphs; intersections", "level": "SL"}, {"id": "T2.5-SL", "topic": "T2", "name": "Modelling with functions (SL set)", "level": "SL"}, {"id": "T2.6-SL", "topic": "T2", "name": "The modelling process", "level": "SL"}, {"id": "T2.7-AHL", "topic": "T2", "name": "Composite and inverse functions", "level": "AHL"}, {"id": "T2.8-AHL", "topic": "T2", "name": "Transformations of graphs", "level": "AHL"}, {"id": "T2.9-AHL", "topic": "T2", "name": "Modelling with e^x, log, logistic and piecewise functions", "level": "AHL"}, {"id": "T2.10-AHL", "topic": "T2", "name": "Scaling with logarithms; linearising data; log-log and semi-log graphs", "level": "AHL"}, {"id": "T3.1-SL", "topic": "T3", "name": "3D distance, midpoint, volumes, surface areas, angles between lines and planes", "level": "SL"}, {"id": "T3.2-SL", "topic": "T3", "name": "Sine rule, cosine rule, area of a triangle", "level": "SL"}, {"id": "T3.3-SL", "topic": "T3", "name": "Applications: elevation, depression, bearings, Pythagoras", "level": "SL"}, {"id": "T3.4-SL", "topic": "T3", "name": "Arc length and sector area (degrees)", "level": "SL"}, {"id": "T3.5-SL", "topic": "T3", "name": "Perpendicular bisectors", "level": "SL"}, {"id": "T3.6-SL", "topic": "T3", "name": "Voronoi diagrams", "level": "SL"}, {"id": "T3.7-AHL", "topic": "T3", "name": "Radian measure; arcs and sectors in radians", "level": "AHL"}, {"id": "T3.8-AHL", "topic": "T3", "name": "Unit circle definitions, Pythagorean identity, exact values, ambiguous case", "level": "AHL"}, {"id": "T3.9-AHL", "topic": "T3", "name": "Geometric transformations with matrices", "level": "AHL"}, {"id": "T3.10-AHL", "topic": "T3", "name": "Vectors: basics", "level": "AHL"}, {"id": "T3.11-AHL", "topic": "T3", "name": "Vector equation of a line", "level": "AHL"}, {"id": "T3.12-AHL", "topic": "T3", "name": "Vector kinematics", "level": "AHL"}, {"id": "T3.13-AHL", "topic": "T3", "name": "Scalar product, vector product, angle between vectors", "level": "AHL"}, {"id": "T3.14-AHL", "topic": "T3", "name": "Graph theory: definitions", "level": "AHL"}, {"id": "T3.15-AHL", "topic": "T3", "name": "Adjacency matrices, walks, transition matrices from graphs", "level": "AHL"}, {"id": "T3.16-AHL", "topic": "T3", "name": "Tree and cycle algorithms", "level": "AHL"}, {"id": "T4.1-SL", "topic": "T4", "name": "Data, sampling, bias, outliers", "level": "SL"}, {"id": "T4.2-SL", "topic": "T4", "name": "Presenting data", "level": "SL"}, {"id": "T4.3-SL", "topic": "T4", "name": "Central tendency and dispersion", "level": "SL"}, {"id": "T4.4-SL", "topic": "T4", "name": "Linear correlation and regression", "level": "SL"}, {"id": "T4.5-SL", "topic": "T4", "name": "Probability basics", "level": "SL"}, {"id": "T4.6-SL", "topic": "T4", "name": "Combined and conditional probability", "level": "SL"}, {"id": "T4.7-SL", "topic": "T4", "name": "Discrete random variables", "level": "SL"}, {"id": "T4.8-SL", "topic": "T4", "name": "Binomial distribution", "level": "SL"}, {"id": "T4.9-SL", "topic": "T4", "name": "Normal distribution", "level": "SL"}, {"id": "T4.10-SL", "topic": "T4", "name": "Spearman's rank correlation", "level": "SL"}, {"id": "T4.11-SL", "topic": "T4", "name": "Hypothesis tests: chi-squared and t-test", "level": "SL"}, {"id": "T4.12-AHL", "topic": "T4", "name": "Data collection design, validity and reliability", "level": "AHL"}, {"id": "T4.13-AHL", "topic": "T4", "name": "Non-linear regression, residuals, R^2", "level": "AHL"}, {"id": "T4.14-AHL", "topic": "T4", "name": "Linear transformations and combinations of random variables; unbiased estimators", "level": "AHL"}, {"id": "T4.15-AHL", "topic": "T4", "name": "Sums of normal variables; central limit theorem", "level": "AHL"}, {"id": "T4.16-AHL", "topic": "T4", "name": "Confidence intervals for a mean", "level": "AHL"}, {"id": "T4.17-AHL", "topic": "T4", "name": "Poisson distribution", "level": "AHL"}, {"id": "T4.18-AHL", "topic": "T4", "name": "Critical regions, tests for mean, proportion and Poisson, test on r, Type I and II errors", "level": "AHL"}, {"id": "T4.19-AHL", "topic": "T4", "name": "Markov chains", "level": "AHL"}, {"id": "T5.1-SL", "topic": "T5", "name": "Limits, derivative as gradient and rate of change", "level": "SL"}, {"id": "T5.2-SL", "topic": "T5", "name": "Increasing and decreasing functions", "level": "SL"}, {"id": "T5.3-SL", "topic": "T5", "name": "Differentiating polynomials with integer powers", "level": "SL"}, {"id": "T5.4-SL", "topic": "T5", "name": "Tangents and normals", "level": "SL"}, {"id": "T5.5-SL", "topic": "T5", "name": "Integration as anti-differentiation; definite integrals; areas", "level": "SL"}, {"id": "T5.6-SL", "topic": "T5", "name": "Stationary points", "level": "SL"}, {"id": "T5.7-SL", "topic": "T5", "name": "Optimisation", "level": "SL"}, {"id": "T5.8-SL", "topic": "T5", "name": "Trapezoidal rule", "level": "SL"}, {"id": "T5.9-AHL", "topic": "T5", "name": "Derivatives of standard functions; chain, product, quotient rules; related rates", "level": "AHL"}, {"id": "T5.10-AHL", "topic": "T5", "name": "Second derivative; second derivative test", "level": "AHL"}, {"id": "T5.11-AHL", "topic": "T5", "name": "Integration of standard functions; substitution", "level": "AHL"}, {"id": "T5.12-AHL", "topic": "T5", "name": "Areas with sign; volumes of revolution", "level": "AHL"}, {"id": "T5.13-AHL", "topic": "T5", "name": "Kinematics", "level": "AHL"}, {"id": "T5.14-AHL", "topic": "T5", "name": "Differential equations by separation of variables", "level": "AHL"}, {"id": "T5.15-AHL", "topic": "T5", "name": "Slope fields", "level": "AHL"}, {"id": "T5.16-AHL", "topic": "T5", "name": "Euler's method (first order and coupled systems)", "level": "AHL"}, {"id": "T5.17-AHL", "topic": "T5", "name": "Phase portraits for coupled linear systems", "level": "AHL"}, {"id": "T5.18-AHL", "topic": "T5", "name": "Euler's method for second order DEs", "level": "AHL"}],TOPICS={"T1": "Number and algebra", "T2": "Functions", "T3": "Geometry and trigonometry", "T4": "Statistics and probability", "T5": "Calculus"},STEPS=[["notes", "Notes read"], ["ex", "Exercises done"], ["form", "Formula from memory"], ["topicq", "Topic questions mastered"], ["pp", "Past-paper secure"]],ERR=["Method not shown", "GDC set-up not written", "Rounding or accuracy", "Misread the question", "Did not know the content", "Ran out of time", "Notation or units", "Other"],PHASES=[["1", "Content completion", "Every Skill ID has Notes read and Exercises done", "notes,ex"], ["2", "Topic consolidation", "Formula from memory and Topic questions mastered for every Skill ID", "form,topicq"], ["3", "Past-paper mode", "Six full sets logged (P1, P2, P3) and Past-paper secure ticked across the board", "pp"], ["4", "Paper 3 drills", "Weekly P3 logged; last three at 70% or more", "p3"], ["5", "Final review", "Error log cleared for the last three papers", "err"]];
const KEY='aihl_tracker_v1';
let S=load();function load(){try{return Object.assign({ck:{},papers:[],errors:[],ia:{},notes:{}},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return{ck:{},papers:[],errors:[],ia:{},notes:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
let view='overview',topicSel='T1';
const VIEWS=[['overview','Overview'],['checklist','Checklist'],['papers','Past papers'],['errors','Error log'],['ia','IA'],['data','Export']];
function nav(){document.getElementById('nav').innerHTML=VIEWS.map(v=>`<button class="${view===v[0]?'on':''}" onclick="go('${v[0]}')">${v[1]}</button>`).join('')}
function go(v){view=v;render()}function render(){nav();({overview,checklist,papers,errors,ia,data})[view](document.getElementById('main'))}
const ck=(id,st)=>!!(S.ck[id]&&S.ck[id][st]);
function tog(id,st){S.ck[id]=S.ck[id]||{};S.ck[id][st]=!S.ck[id][st];if(S.ck[id][st])S.ck[id][st+'_d']=today();save();if(view==='overview')render()}
function topicPct(t){const rows=SK.filter(s=>s.topic===t);let n=0;rows.forEach(s=>STEPS.forEach(st=>{if(ck(s.id,st[0]))n++}));return Math.round(100*n/(rows.length*STEPS.length))}
function stepPct(st,t){const rows=t?SK.filter(s=>s.topic===t):SK;return Math.round(100*rows.filter(s=>ck(s.id,st)).length/rows.length)}
function fullSets(){const by={};S.papers.forEach(p=>{const k=p.session;by[k]=by[k]||{};by[k][p.paper]=1});return Object.values(by).filter(v=>v.P1&&v.P2&&v.P3).length}
function p3ok(){const p3=S.papers.filter(p=>p.paper==='P3').slice(-3);return p3.length===3&&p3.every(p=>p.max&&p.marks/p.max>=0.7)}
function phase(){if(stepPct('notes')<100||stepPct('ex')<100)return 1;if(stepPct('form')<100||stepPct('topicq')<100)return 2;if(fullSets()<6||stepPct('pp')<100)return 3;if(!p3ok())return 4;return 5}
function grade(pct){const b=[[0,1],[15,2],[30,3],[42,4],[54,5],[64,6],[72,7]];let g=1;b.forEach(x=>{if(pct>=x[0])g=x[1]});return g}
// ---------- Overview
function overview(m){const ph=phase();let h=`<div class="card"><h2>Where you are</h2><div class="ph">`+PHASES.map(p=>`<div class="${+p[0]===ph?'cur':''}"><b>Phase ${p[0]}: ${p[1]}</b><span class="muted">${p[2]}</span></div>`).join('')+`</div></div>`;
 h+=`<div class="card"><h2>Progress by topic</h2><div class="grid">`+Object.keys(TOPICS).map(t=>{const rows=SK.filter(s=>s.topic===t);const pct=topicPct(t);return `<div class="box"><b>${t} ${TOPICS[t]}</b><div class="muted">${rows.length} skills (${rows.filter(s=>s.level==='SL').length} SL, ${rows.filter(s=>s.level==='AHL').length} AHL)</div><div class="bar"><i style="width:${pct}%"></i></div><div class="row"><span class="pill ${pct===100?'m':pct?'d':'n'}">${pct}%</span><button class="btn ghost2" onclick="topicSel='${t}';go('checklist')">Open</button></div></div>`}).join('')+`</div></div>`;
 h+=`<div class="card"><h2>Progress by step (all 78 skills)</h2><table><tr><th>Step</th><th>Done</th><th style="width:50%">Bar</th></tr>`+STEPS.map(st=>{const n=SK.filter(s=>ck(s.id,st[0])).length;return `<tr><td>${st[1]}</td><td>${n} / ${SK.length}</td><td><div class="bar"><i style="width:${Math.round(100*n/SK.length)}%"></i></div></td></tr>`}).join('')+`</table></div>`;
 const open=S.errors.filter(e=>!e.cleared).length;const last=S.papers.slice(-3);
 h+=`<div class="card"><h2>Papers and errors</h2><div class="row"><span class="tag">Full sets logged: ${fullSets()} of 6</span><span class="tag">Papers logged: ${S.papers.length}</span><span class="tag" style="color:${open?'var(--red)':'var(--green)'}">Open errors: ${open}</span></div>${last.length?`<h3>Last three papers</h3><table><tr><th>Session</th><th>Paper</th><th>Score</th><th>Grade est.</th></tr>`+last.map(p=>`<tr><td>${p.session}</td><td>${p.paper}</td><td>${p.marks}/${p.max} (${Math.round(100*p.marks/p.max)}%)</td><td>${grade(100*p.marks/p.max)}</td></tr>`).join('')+`</table>`:''}</div>`;
 h+=`<div class="card muted">Grade estimates use approximate AI HL boundaries (7 from about 72%, 6 from 64%, 5 from 54%, 4 from 42%). Real boundaries move each session; replace with the subject report figures when you have them.</div>`;
 m.innerHTML=h}
// ---------- Checklist
function checklist(m){let h=`<div class="card"><div class="row">`+Object.keys(TOPICS).map(t=>`<button class="btn ${t===topicSel?'':'ghost2'}" onclick="topicSel='${t}';render()">${t}</button>`).join('')+`<span class="muted">Tick each step as it is done. Hover a tick for the date.</span></div></div>`;
 const rows=SK.filter(s=>s.topic===topicSel);
 h+=`<div class="card"><h2>${topicSel} ${TOPICS[topicSel]} <span class="pill ${topicPct(topicSel)===100?'m':'d'}">${topicPct(topicSel)}%</span></h2><table><tr><th>Skill</th>`+STEPS.map(st=>`<th class="c" title="${st[1]}"><span class="lbl">${st[1]}</span><span class="muted" style="display:none">${st[0]}</span></th>`).join('')+`<th>Note</th></tr>`;
 rows.forEach(s=>{h+=`<tr><td><span class="tag ${s.level==='AHL'?'ahl':'sl'}">${s.level}</span><span class="tag">${s.id}</span><br>${s.name}</td>`+STEPS.map(st=>`<td class="c"><input type="checkbox" ${ck(s.id,st[0])?'checked':''} title="${(S.ck[s.id]&&S.ck[s.id][st[0]+'_d'])||''}" onchange="tog('${s.id}','${st[0]}')"></td>`).join('')+`<td><input type="text" style="width:100%" value="${(S.notes[s.id]||'').replace(/"/g,'&quot;')}" placeholder="e.g. weak on part (c) style" onchange="S.notes['${s.id}']=this.value;save()"></td></tr>`});
 h+=`</table><div class="row" style="margin-top:8px"><button class="btn ghost2" onclick="bulk('${topicSel}','notes',true)">Tick all Notes read</button><button class="btn ghost2" onclick="bulk('${topicSel}','ex',true)">Tick all Exercises done</button><button class="btn danger" onclick="if(confirm('Clear every tick in ${topicSel}?'))bulk('${topicSel}',null,false)">Clear topic</button></div></div>`;
 m.innerHTML=h}
function bulk(t,st,val){SK.filter(s=>s.topic===t).forEach(s=>{if(st){S.ck[s.id]=S.ck[s.id]||{};S.ck[s.id][st]=val;if(val)S.ck[s.id][st+'_d']=today()}else delete S.ck[s.id]});save();render()}
// ---------- Papers
function papers(m){let h=`<div class="card"><h2>Log a paper</h2><div class="row"><input type="text" id="ps" placeholder="Session, e.g. May 2024 TZ2" style="width:170px"><select id="pp"><option>P1</option><option>P2</option><option>P3</option><option>Mock P1</option><option>Mock P2</option><option>Mock P3</option></select><input type="number" id="pm" placeholder="marks" style="width:80px"><input type="number" id="px" placeholder="out of" style="width:80px"><input type="date" id="pd" value="${today()}"><input type="number" id="pt" placeholder="min used" style="width:90px"><button class="btn" onclick="addPaper()">Add</button></div><div class="muted" style="margin-top:6px">Lost marks by type for this paper (enter after marking):</div><div class="row">`+ERR.map((e,i)=>`<label class="muted">${e} <input type="number" id="pe${i}" style="width:50px" min="0"></label>`).join('')+`</div></div>`;
 h+=`<div class="card"><h2>Papers logged (${S.papers.length}; full sets ${fullSets()} of 6)</h2>`+(S.papers.length?`<table><tr><th>Date</th><th>Session</th><th>Paper</th><th>Score</th><th>%</th><th>Grade est.</th><th>Min</th><th>Top loss type</th><th></th></tr>`+S.papers.map((p,i)=>{const top=p.lost?ERR.map((e,j)=>[e,p.lost[j]||0]).sort((a,b)=>b[1]-a[1])[0]:null;return `<tr><td>${p.date}</td><td>${p.session}</td><td>${p.paper}</td><td>${p.marks}/${p.max}</td><td>${Math.round(100*p.marks/p.max)}</td><td>${grade(100*p.marks/p.max)}</td><td>${p.min||''}</td><td>${top&&top[1]?top[0]+' ('+top[1]+')':''}</td><td><button class="btn danger" onclick="S.papers.splice(${i},1);save();render()">x</button></td></tr>`}).join('')+`</table>`:'<div class="muted">None yet.</div>')+`</div>`;
 const tot=ERR.map((e,j)=>S.papers.reduce((a,p)=>a+((p.lost&&p.lost[j])||0),0));const sum=tot.reduce((a,b)=>a+b,0);
 if(sum)h+=`<div class="card"><h2>Where marks go (all papers)</h2><table>`+ERR.map((e,j)=>`<tr><td>${e}</td><td style="width:60px">${tot[j]}</td><td style="width:50%"><div class="bar"><i style="width:${Math.round(100*tot[j]/sum)}%"></i></div></td></tr>`).join('')+`</table></div>`;
 m.innerHTML=h}
function addPaper(){const v=id=>document.getElementById(id).value;if(!v('ps')||!v('pm')||!v('px'))return alert('Session, marks and out of are needed');S.papers.push({session:v('ps'),paper:v('pp'),marks:+v('pm'),max:+v('px'),date:v('pd'),min:v('pt'),lost:ERR.map((e,i)=>+v('pe'+i)||0)});save();render()}
// ---------- Errors
function errors(m){const opts=SK.map(s=>`<option value="${s.id}">${s.id} ${s.name}</option>`).join('');
 let h=`<div class="card"><h2>Log an error</h2><div class="row"><select id="es">${opts}</select><select id="et">${ERR.map(e=>`<option>${e}</option>`).join('')}</select><input type="text" id="ew" placeholder="Where (paper, question)" style="width:180px"></div><textarea id="ed" placeholder="What went wrong and what you will do instead (one line)"></textarea><button class="btn" onclick="addErr()">Add</button></div>`;
 const open=S.errors.filter(e=>!e.cleared),done=S.errors.filter(e=>e.cleared);
 const list=arr=>arr.length?`<table><tr><th>Date</th><th>Skill</th><th>Type</th><th>Where</th><th>Note</th><th>Cleared</th><th></th></tr>`+arr.map(e=>{const i=S.errors.indexOf(e);return `<tr><td>${e.date}</td><td><span class="tag">${e.skill}</span></td><td>${e.type}</td><td>${e.where}</td><td>${e.note}</td><td class="c"><input type="checkbox" ${e.cleared?'checked':''} onchange="S.errors[${i}].cleared=this.checked;save();render()"></td><td><button class="btn danger" onclick="S.errors.splice(${i},1);save();render()">x</button></td></tr>`}).join('')+`</table>`:'<div class="muted">None.</div>';
 h+=`<div class="card"><h2>Open (${open.length})</h2><div class="muted">Cleared means: redone from memory, correctly, on a later day.</div>${list(open)}</div><div class="card"><details><summary>Cleared (${done.length})</summary>${list(done)}</details></div>`;
 m.innerHTML=h}
function addErr(){const v=id=>document.getElementById(id).value;S.errors.push({date:today(),skill:v('es'),type:v('et'),where:v('ew'),note:v('ed'),cleared:false});save();render()}
// ---------- IA
function ia(m){const C=[["A","Presentation",4],["B","Mathematical communication",4],["C","Personal engagement",3],["D","Reflection",3],["E","Use of mathematics",6]];const ST=["Topic chosen","Plan agreed with teacher","Data collected","First draft","Teacher feedback received","Final draft","Submitted"];
 let h=`<div class="card"><h2>IA milestones</h2>`+ST.map(s=>`<label style="display:block;margin:4px 0"><input type="checkbox" ${S.ia[s]?'checked':''} onchange="S.ia['${s}']=this.checked;save()"> ${s}</label>`).join('')+`</div>`;
 h+=`<div class="card"><h2>Self-assessment against the criteria</h2><table><tr><th>Criterion</th><th>Max</th><th>Current draft</th><th>Target</th><th>What is missing</th></tr>`+C.map(c=>`<tr><td>${c[0]} ${c[1]}</td><td>${c[2]}</td><td><input type="number" min="0" max="${c[2]}" style="width:60px" value="${S.ia['s'+c[0]]??''}" onchange="S.ia['s${c[0]}']=+this.value;save();render()"></td><td><input type="number" min="0" max="${c[2]}" style="width:60px" value="${S.ia['t'+c[0]]??c[2]}" onchange="S.ia['t${c[0]}']=+this.value;save();render()"></td><td><input type="text" style="width:100%" value="${(S.ia['n'+c[0]]||'').replace(/"/g,'&quot;')}" onchange="S.ia['n${c[0]}']=this.value;save()"></td></tr>`).join('')+`<tr><td><b>Total</b></td><td>20</td><td><b>${C.reduce((a,c)=>a+(S.ia['s'+c[0]]||0),0)}</b></td><td><b>${C.reduce((a,c)=>a+(S.ia['t'+c[0]]??c[2]),0)}</b></td><td class="muted">17+ is the target for a 7</td></tr></table></div>`;
 m.innerHTML=h}
// ---------- Data
function data(m){m.innerHTML=`<div class="card"><h2>Export / import</h2><p class="muted">Everything is stored in this browser only. Export a code to move it to another device or to keep a backup; paste a code and Import to restore.</p><div class="row"><button class="btn" onclick="document.getElementById('code').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))))">Export code</button><button class="btn ghost" onclick="try{S=Object.assign({ck:{},papers:[],errors:[],ia:{},notes:{}},JSON.parse(decodeURIComponent(escape(atob(document.getElementById('code').value.trim())))));save();render()}catch(e){alert('Code not recognised')}">Import code</button><button class="btn danger" onclick="if(confirm('Delete all tracker data in this browser?')){S={ck:{},papers:[],errors:[],ia:{},notes:{}};save();render()}">Reset</button></div><textarea id="code" style="min-height:120px"></textarea></div>
<div class="card"><h2>About</h2><p class="muted">Skill IDs match the curriculum map (78 subtopics, 39 SL and 39 AHL). Steps: Notes read, Exercises done, Formula from memory, Topic questions mastered (three correct on two different days), Past-paper secure (no marks lost on that skill in the last two full papers). Phases follow the May 2027 plan: content completion, topic consolidation, past-paper mode, Paper 3 drills, final review.</p></div>`}
render();
</script></body></html>
